name: Label rerun

# When the ``ci-reviewed`` label is added to a PR, rerun all failed jobs in
# the latest CI run. This re-evaluates ``review-labels`` (which now sees the
# label) and GitHub reruns the dependent ``all-checks-pass`` gate.
#
# ``gh run rerun`` only works on a completed run. Thus this waits when the
# run is still in progress. A completed successful run needs no recovery and
# exits without asking GitHub to rerun an empty failed-job set. Python CI
# permits 90 minutes; observation must not report success before a needed
# rerun was submitted. Re-run this helper to recover a timed-out observation;
# do not restart an active CI run.
#
# The review comment updates without help. The poller in
# ci-review-comment.yml watches the CI run through the API. It gets the
# rerun results.

on:
  pull_request:
    types: [labeled]

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: label-rerun-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rerun-review-labels:
    name: Rerun review-labels job
    if: github.event.label.name == 'ci-reviewed'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Wait for CI run to finish, then rerun failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Find the latest CI run for this PR's head SHA.
          RUN_INFO=$(gh run list \
            --repo "$REPO" \
            --commit "$HEAD_SHA" \
            --workflow ci.yaml \
            --limit 1 \
            --json databaseId,status,conclusion \
            --jq '.[0] | select(. != null) | "\(.databaseId) \(.status) \(.conclusion // "unknown")"')

          if [ -z "$RUN_INFO" ]; then
            echo "CI run not yet available; rerun this helper after CI starts."
            exit 1
          fi

          read -r RUN_ID STATUS CONCLUSION <<< "$RUN_INFO"

          echo "Latest CI run: $RUN_ID (status: $STATUS, conclusion: $CONCLUSION)"

          # If the run is still in progress, wait for it to finish.
          # gh run rerun only works on completed runs — if we try while it's
          # running, GitHub rejects with "cannot be rerun; This workflow is
          # already running".
          if [ "$STATUS" != "completed" ]; then
            echo "Run is $STATUS — waiting for completion (this may take a while)..."
            # gh run watch --exit-status exits non-zero if the run fails,
            # which is expected (the label gate fails). Don't let that kill
            # the workflow — we WANT to rerun failed jobs.
            timeout 6000 gh run watch "$RUN_ID" --repo "$REPO" --interval 15 || true

            # Verify it's actually completed now.
            FINAL_INFO=$(gh run view "$RUN_ID" \
              --repo "$REPO" \
              --json status,conclusion \
              --jq '"\(.status) \(.conclusion // "unknown")"' 2>/dev/null || true)
            read -r STATUS CONCLUSION <<< "${FINAL_INFO:-unknown unknown}"
            if [ "$STATUS" != "completed" ]; then
              echo "Run is still $STATUS; recovery pending. Rerun this helper, not the active CI run."
              exit 1
            fi
          fi

          if [ "$CONCLUSION" = "success" ]; then
            echo "Run already succeeded; no failed jobs need recovery."
            exit 0
          fi

          echo "Run completed with conclusion $CONCLUSION. Rerunning all failed jobs..."
          gh run rerun "$RUN_ID" --repo "$REPO" --failed
          echo "Done. GitHub will rerun review-labels and all dependent jobs."
