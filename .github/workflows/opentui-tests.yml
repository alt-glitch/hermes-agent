name: Native OpenTUI Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Native OpenTUI checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui-opentui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.3.0
          cache: npm
          cache-dependency-path: ui-opentui/package-lock.json

      - name: Install native package dependencies
        run: |
          unset NODE_ENV
          npm ci

      - name: Run native checks and tests
        run: |
          unset NODE_ENV
          npm run check

      - name: Build native bundle
        run: |
          unset NODE_ENV
          npm run build
